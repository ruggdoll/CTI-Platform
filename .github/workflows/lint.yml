# Ce qui est verifie ici porte sur le CONTENU, jamais sur le style du code.
#
# Les etapes `ruff` et `compile` ont ete retirees le 2026-09-19 : elles
# policaient quatre scripts que seul leur auteur lit, et une publication de
# l'outil a fait rougir `main` le 2026-09-14 avec dix-huit defauts apparus sans
# qu'une ligne ait bouge. Une CI qui rougit pour une raison etrangere au
# contenu coute de l'attention et n'apprend rien.
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: validate YAML
        run: |
          python - <<'PY'
          import pathlib, yaml

          # Les fichiers Compose portent des tags d'extension propres a Docker
          # (`!override`, `!reset`) que safe_load refuse. Les ignorer plutot que
          # les interpreter : on verifie ici la syntaxe YAML, pas la semantique
          # Compose. Sans cela le controle echouait sur chaque execution depuis
          # la mise en place de compose.tuning.yml -- une CI rouge en
          # permanence, que plus personne ne lit.
          class Tolerant(yaml.SafeLoader):
              pass

          Tolerant.add_multi_constructor(
              "", lambda loader, suffix, node: None)

          cibles = [pathlib.Path("compose.tuning.yml"),
                    pathlib.Path("opencti/docker-compose.yml")]
          cibles += sorted(pathlib.Path("provisioning").rglob("*.yaml"))
          for p in cibles:
              if not p.exists():
                  print("absent, ignore:", p); continue
              yaml.load(p.read_text(), Loader=Tolerant); print("ok", p)
          PY
