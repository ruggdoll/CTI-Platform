# Ce qui est verifie ici porte sur le CONTENU, jamais sur le style du code.
#
# Les etapes `ruff` et `compile` ont ete retirees le 2026-09-19 : elles
# policaient quatre scripts que seul leur auteur lit, et une publication de
# l'outil a fait rougir `main` le 2026-09-14 avec dix-huit defauts apparus sans
# qu'une ligne ait bouge. Une CI qui rougit pour une raison etrangere au
# contenu coute de l'attention et n'apprend rien.
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: validate YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          for p in [pathlib.Path("compose.tuning.yml"), pathlib.Path("opencti/docker-compose.yml")] + list(pathlib.Path("provisioning").rglob("*.yaml")):
              yaml.safe_load(p.read_text()); print("ok", p)
          PY
