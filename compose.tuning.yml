# Override compose de la pile MISP de CTI-Platform : réglages MariaDB pour la
# charge d'imports d'IOC, publication des ports, et noms de volumes explicites.
# Appliqué par le Makefile (-f vendor/misp-docker/docker-compose.yml -f compose.tuning.yml).
services:
  db:
    # MariaDB doit vider son buffer pool avant de rendre la main. Le défaut
    # Docker est de 10 s sur TOUT chemin d'arrêt — y compris l'arrêt du démon,
    # que `compose stop -t` ne couvre pas. Voir opencti/docker-compose.yml.
    stop_grace_period: ${STOP_GRACE_DATA:-120s}
    volumes:
      - ${CTI_PLATFORM_ROOT}/docker/mariadb-tuning.cnf:/etc/mysql/mariadb.conf.d/99-cti-platform.cnf:ro
    # cgroup : réserver la RAM au buffer pool (voir INNODB_BUFFER_POOL_SIZE dans .env)
    mem_limit: 16g
    mem_reservation: 8g

  misp-core:
    # imports longs : ne pas tuer un worker de feed en cours — à l'arrêt non plus
    stop_grace_period: ${STOP_GRACE_DATA:-120s}
    environment:
      - "FASTCGI_READ_TIMEOUT=600s"
      - "PHP_MEMORY_LIMIT=3072M"
    # Publication des ports sur l'interface choisie : 0.0.0.0 (défaut) rend MISP
    # joignable par FQDN ou IP depuis une autre machine, 127.0.0.1 le restreint
    # au poste local — le cas du mode proxy inverse.
    #
    # `!override` est INDISPENSABLE : compose CONCATÈNE les listes `ports` entre
    # fichiers au lieu de les remplacer. L'amont publie déjà CORE_HTTP_PORT et
    # CORE_HTTPS_PORT, sans adresse de liaison. Sans ce marqueur, chaque port
    # est publié DEUX fois — ce qui passait inaperçu tant que BIND_ADDRESS
    # valait 0.0.0.0 (entrées identiques, fusionnées) et échouait dès qu'elles
    # divergeaient : « failed to bind host port 127.0.0.1:8081: address already
    # in use ».
    ports: !override
      - "${BIND_ADDRESS:-0.0.0.0}:${CORE_HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${CORE_HTTPS_PORT:-443}:443"
    # Le healthcheck amont fait `curl ${BASE_URL}/users/heartbeat` DEPUIS le
    # conteneur : le nom public doit s'y résoudre. On le renvoie sur l'hôte, où
    # les ports sont publiés (même mécanisme que connector-misp-intel).
    # CTI_HOST_TARGET vaut `host-gateway` en rootful ; en ROOTLESS il doit valoir
    # l'adresse réelle de l'hôte (`make init` la détecte) — `host-gateway` y
    # désigne un pont où rien n'écoute et le healthcheck reste unhealthy pour
    # toujours, alors que MISP répond parfaitement depuis l'extérieur.
    extra_hosts:
      - "${CTI_HOSTNAME:-localhost}:${CTI_HOST_TARGET:-host-gateway}"

# Noms de volumes explicites : sans `name:`, Docker préfixe par le nom du projet
# compose et on se retrouve avec des volumes au nom hérité de l'historique du
# dépôt. Ici on les nomme par produit et par rôle, lisibles dans `docker volume ls`.
volumes:
  mysql_data:
    name: misp_bdd
  cache_data:
    name: misp_cache
  misp_guard_ca:
    name: misp_guard_ca
